name: dev_launcher
description: A new Dartvel project
publish_to: "none"
version: 0.1.8+8

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
platforms:
  web:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  dartvel_core: ^0.13.51
  dartvel_shelf: ^0.13.51
  dartvel_flutter: ^0.13.51
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  dartvel_cli: ^0.13.51


flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

dartvel:
  org: com.danieleffiong
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://api.dev-launcher.com
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  ota: false
  android:
    # Offered as the phone's home app, and allowed to see the installed apps.
    launcher: true
  platforms:
    - web
    - android

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  seo:
    siteName: Dev Launcher
    defaultTitle: Dev Launcher
    defaultDescription: The Android home screen for developers. Type to open any app, run launcher commands, and keep your dev tools one tap away.
    accent: '#3FB950'
  pwa:
    icon: assets/icon.png
    name: Dev Launcher
    shortName: Dev Launcher
    themeColor: '#0B0F14'
    backgroundColor: '#0B0F14'
